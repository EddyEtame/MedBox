# Scénario principal : 15 % de l'équipage sous surveillance renforcée.
# Toutes les valeurs ci-dessous sont des DELTAS par rapport a la ligne de base
# saine et personnelle de chaque membre, jamais des mesures absolues inventées.
name: Alerte respiratoire à bord
description: >
  Six membres sur quarante présentent une détérioration compatible avec une
  exposition respiratoire confirmée par le scénario. Le système détecte les
  écarts, priorise la surveillance et propose l'affectation en zone d'isolement
  sans poser de diagnostic.
crew: 40

simulation:
  data: synthetic
  clock: accelerated
  represented_duration: 6h
  demo_duration: 90s
  adjustment_mode: delta-from-personal-healthy-baseline
  diagnostic_claim: none
  parameter_source: operator-authored-demo-choreography
  provenance:
    - Royal College of Physicians NEWS2
    - PhysioNet Challenge 2019 (validation reference; these deltas are not fitted coefficients)
    - Jensen et al. 2015 temperature-pulse-respiration association

timeline:
  - at: 0s
    do: note
    text: "Situation nominale : quarante membres dans leur plage habituelle."

  # Premier signal faible. La SpO2 reste a sa ligne de base.
  - at: 10s
    do: afflict
    exposure_confirmed: true
    mode: delta
    provenance: operator-authored-demo-choreography
    patients: 2
    temperature: 1.5
    pulse: 30
    # 9, not 7: with a personal baseline of 12 to 17 breaths a minute, +7 left
    # one of the two under the 21/min the isolation rule reads as raised, so
    # the ship counted five candidates while the narration said six.
    respiration: 9
    over: 25

  - at: 20s
    do: note
    text: "Deux écarts thermiques et respiratoires détectés à bord."

  # Quatre autres profils, avec un delta SpO2 explicitement fourni par le
  # scenario : la temperature seule n'est jamais utilisee pour l'inventer.
  - at: 28s
    do: afflict
    exposure_confirmed: true
    mode: delta
    provenance: operator-authored-demo-choreography
    patients: 4
    temperature: 2.2
    spo2: -5.5
    pulse: 48
    respiration: 11
    over: 30

  - at: 45s
    do: note
    text: "Six sur quarante : seuil opérationnel de 15 %. Isolement proposé, validation humaine requise."

  - at: 60s
    do: note
    text: "Mode IA indisponible : mesures, priorisation et isolement restent actifs."
